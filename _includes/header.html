<header>
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav>
    {%- for item in site.data.nav %}
    {%- assign href = '/' | append: item.url | relative_url %}
    <a href="{{ href }}"{% if page.url contains item.url %} class="on" aria-current="page"{% endif %}>{{ item.title }}</a>
    {%- endfor %}
    <a class="nav-mobile-cta" href="mailto:{{ site.contact_email }}">Contact us</a>
  </nav>
  <div class="nav-cta"><a class="btn btn-primary" href="mailto:{{ site.contact_email }}">Contact us</a></div>
  <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 5h14M2 9h14M2 13h14"/></svg></button>
</header>
