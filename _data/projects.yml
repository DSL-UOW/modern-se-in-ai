- area: Agile teams · Effort estimation
  title: Human-AI teams in agile effort estimation
  pitch: We build a platform where hybrid teams of human developers and AI agents meet online, discuss each user story and agree on the effort, in the same way as Planning Poker. Each agent takes a team role, such as front-end or back-end developer, explains its estimate and points to similar past stories.
  media: seeagent-platform.jpg
  video: https://youtu.be/0jrmOUjQbi8
  video_length: "3:07"
  # Source: arXiv 2509.14483, human study, Section III-B and Fig. 4 (12 participants)
  stats:
  - value: 100%
    label: said the agents would benefit agile teams
  - value: 83%
    label: said working with the agents felt natural
  - value: 67%
    label: said the agents helped the team reach consensus efficiently
  stats_note: Survey of software practitioners after a live estimation session with the agents.
  cta:
    label: Request a live demo
    url: https://www.uow.edu.au/research/decision-systems-lab/contact/
  leads:
  - name: Thanh-Long Bui
    role: PhD researcher
    photo: ""
  - name: Hoa Khanh Dam
    role: Professor
    photo: hoa.png
  quote:
    text: It can help the team not only estimate the user stories correctly but also see the related issues arising when implementing these sorts of features in the past.
    by: Participant, practitioner study
  # Source: arXiv 2509.14483, Sections II and III-B
  steps:
  - title: Bring a user story
    text: The product owner presents a user story to a team of human developers and AI agents.
  - title: Estimate and explain
    text: Each person and each agent gives a story point estimate. The agents give their reasons and point to similar stories from the project history.
  - title: Discuss and agree
    text: When the estimates are different, the team discusses and estimates again until everyone agrees.
  figure:
    image: seeagent.png
    caption: "Architecture of an estimation agent: memory, action module and communication manager."
  papers:
  - title: An LLM-based multi-agent framework for agile effort estimation
    venue: ASE 2025 (A*)
    authors: [Thanh-Long Bui, Hoa Khanh Dam, Rashina Hoda]
